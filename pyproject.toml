[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duka-ai-engine"
version = "0.1.0"
description = "Duka AI Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Basepoint" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "cryptography>=42.0.0",
  "openrouter>=0.1.0",
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# BLE001: this repo's convention is to catch Exception at integration boundaries,
# tagged "# pragma: no cover - defensive branch" (see CLAUDE.md).
# FLY002: misfires on joins of function-call results, not string literals.
ignore = ["BLE001", "FLY002"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

